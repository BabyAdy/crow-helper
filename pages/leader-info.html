<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: #fafafa; font-family: sans-serif; }
        .nav-item { cursor: pointer; color: #71717a; font-size: 14px; transition: 0.3s; padding-bottom: 4px; border-bottom: 2px solid transparent; text-decoration: none; }
        .nav-item:hover { color: #a855f7; }
        .active { color: #a855f7 !important; border-bottom-color: #a855f7 !important; font-weight: bold; }
        .info-card { background: #0a0a0a; border: 1px solid #1f2937; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .question { color: #a855f7; font-weight: 800; margin-bottom: 5px; display: block; }
        .answer { color: #d1d5db; background: #111; padding: 12px; border-radius: 8px; display: block; border-left: 3px solid #fbbf24; }
    </style>
</head>
<body>
    <nav class="flex items-center justify-between px-10 py-5 bg-[#0a0a0a] border-b border-zinc-800 sticky top-0 z-50 text-white">
        <div class="flex items-center gap-10">
            <div class="text-xl font-black uppercase tracking-tighter text-white">CROW<span class="text-purple-600">HELPER</span></div>
            <div id="nav-links" class="flex gap-6"></div>
        </div>
        <button onclick="logout()" class="text-xs text-red-500 font-bold border border-red-900/30 px-3 py-1.5 rounded-lg hover:bg-red-900/10 text-white">LOGOUT</button>
    </nav>

    <div class="max-w-5xl mx-auto mt-10 p-5">
        <h1 class="text-3xl font-black mb-8 uppercase italic text-white">Leader <span class="text-purple-600">Dashboard Info</span></h1>
        
        <div class="info-card">
            <span class="question">Q: Cum acord FW (Faction Warn)?</span>
            <span class="answer">A: (/fwarn) ID Motiv -> Trebuie să ai dovadă (screen/video) pentru fiecare sancțiune.</span>
        </div>

        <div class="info-card">
            <span class="question">Q: Când pot organiza un raport de activitate?</span>
            <span class="answer">A: În fiecare duminică între orele 14:00 - 20:00.</span>
        </div>
    </div>
    <script src="nav-logic.js"></script>
</body>
</html>
