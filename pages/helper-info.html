<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>CrowHelper - Helper Info</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background-color: #050505; color: #fafafa; font-family: sans-serif; }
        
        /* Navbar Styles */
        .nav-item { cursor: pointer; color: #71717a; font-size: 14px; transition: 0.3s; padding-bottom: 4px; border-bottom: 2px solid transparent; text-decoration: none; }
        .nav-item:hover { color: #a855f7; }
        .active { color: #a855f7 !important; border-bottom-color: #a855f7 !important; font-weight: bold; }

        /* Buton AHK stilizat */
        .btn-ahk-access {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(168, 85, 247, 0.1);
            color: #a855f7;
            border: 1px solid rgba(168, 85, 247, 0.4);
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s;
            text-decoration: none;
        }
        .btn-ahk-access:hover {
            background: #a855f7;
            color: white;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
            transform: translateY(-2px);
        }

        /* Cardul care grupează totul */
        .info-group { 
            background: #0a0a0a; 
            border: 1px solid #1f2937; 
            border-right: 4px solid #a855f7; 
            border-radius: 12px; 
            padding: 24px; 
            margin-bottom: 30px; 
        }

        .question { color: #a855f7; font-weight: 800; font-size: 1.1rem; margin-bottom: 12px; display: block; }
        
        .answer-box { 
            background: #0f0f0f; 
            border: 1px solid #1a1a1a;
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 15px;
            font-family: 'Consolas', monospace;
        }

        .cmd { color: #fbbf24; font-weight: bold; }

        .staff-image { 
            width: 100%; 
            border-radius: 8px; 
            border: 1px solid #1f2937;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <nav class="flex items-center justify-between px-10 py-5 bg-[#0a0a0a] border-b border-zinc-800 sticky top-0 z-50">
        <div class="flex items-center gap-10">
            <div class="text-xl font-black uppercase tracking-tighter">CROW<span class="text-purple-600">HELPER</span></div>
            <div id="nav-links" class="flex gap-6"></div>
        </div>
        <button onclick="logout()" class="text-xs text-red-500 font-bold border border-red-900/30 px-3 py-1.5 rounded-lg hover:bg-red-900/10">LOGOUT</button>
    </nav>

    <div class="max-w-5xl mx-auto mt-12 px-6">
        <div class="flex flex-col md:flex-row md:items-center justify-between mb-12 gap-4">
            <h1 class="text-4xl font-black uppercase italic text-white tracking-widest border-l-8 border-purple-600 pl-6">
                Helper <span class="text-purple-600">Information</span>
            </h1>
            
            <a href="helper-ahk.html" class="btn-ahk-access">
                <i class="fa-solid fa-shield-heart"></i> Helper Autohotkey
            </a>
        </div>

        <div class="info-group">
            <span class="question">Q: Vinzi cartofi?</span>
            <div class="answer-box">
                <span class="cmd">(/nd)</span> /n Aiurea
            </div>
        </div>

        <div class="info-group">
            <span class="question">Q: Cat costa e30 in DS?</span>
            <div class="answer-box">
                <span class="cmd">(/n)</span> Vehicului Ubermacht M3 E30 costa 123.123.123$ in Dealership!
            </div>
            <img src="https://cdn.discordapp.com/attachments/1393386209807695972/1484253225862430740/image.png" alt="Locație DS" class="staff-image">
        </div>

        <div class="info-group">
            <span class="question">Q: Cum ajung la pescuit?</span>
            <div class="answer-box">
                <span class="cmd">(/n)</span> Folosește comanda /gps -> Locații Joburi -> Fisherman.
            </div>
        </div>

    </div>

    <script src="nav-logic.js"></script>
</body>
</html>
