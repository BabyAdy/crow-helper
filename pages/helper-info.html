<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: #fafafa; font-family: sans-serif; }
        
        /* Navbar Styles */
        .nav-item { cursor: pointer; color: #71717a; font-size: 14px; transition: 0.3s; padding-bottom: 4px; border-bottom: 2px solid transparent; text-decoration: none; }
        .nav-item:hover { color: #a855f7; }
        .active { color: #a855f7 !important; border-bottom-color: #a855f7 !important; font-weight: bold; }

        /* Cardul care grupează totul */
        .info-group { 
            background: #0a0a0a; 
            border: 1px solid #1f2937; 
            border-right: 4px solid #a855f7; /* Dungă mov în dreapta ca în poză */
            border-radius: 12px; 
            padding: 24px; 
            margin-bottom: 30px; 
        }

        .question { color: #a855f7; font-weight: 800; font-size: 1.1rem; margin-bottom: 12px; display: block; }
        
        .answer-box { 
            background: #0f0f0f; 
            border: 1px solid #1a1a1a;
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 15px;
            font-family: 'Consolas', monospace;
        }

        .cmd { color: #fbbf24; font-weight: bold; } /* Galben pentru comenzi */

        .staff-image { 
            width: 100%; 
            border-radius: 8px; 
            border: 1px solid #1f2937;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <nav class="flex items-center justify-between px-10 py-5 bg-[#0a0a0a] border-b border-zinc-800 sticky top-0 z-50">
        <div class="flex items-center gap-10">
            <div class="text-xl font-black uppercase tracking-tighter">CROW<span class="text-purple-600">HELPER</span></div>
            <div id="nav-links" class="flex gap-6"></div>
        </div>
        <button onclick="logout()" class="text-xs text-red-500 font-bold border border-red-900/30 px-3 py-1.5 rounded-lg hover:bg-red-900/10">LOGOUT</button>
    </nav>

    <div class="max-w-5xl mx-auto mt-12 px-6">
        <h1 class="text-3xl font-black mb-10 uppercase italic text-white tracking-widest">
            Helper <span class="text-purple-600">Information</span>
        </h1>

        <div class="info-group">
            <span class="question">Q: Vinzi cartofi?</span>
            <div class="answer-box">
                <span class="cmd">(/nd)</span> /n Aiurea
            </div>
        </div>

        <div class="info-group">
            <span class="question">Q: Cat costa e30 in DS?</span>
            <div class="answer-box">
                <span class="cmd">(/n)</span> Vehicului Ubermacht M3 E30 costa 123.123.123$ in Dealership!
            </div>
            <img src="https://cdn.discordapp.com/attachments/1393386209807695972/1484253225862430740/image.png?ex=69bd8e09&is=69bc3c89&hm=5f4f38f1e5ac0487b9f489fb3001c88fb43803a1677badd77076f87357ebd851&" alt="Locație DS" class="staff-image">
        </div>

        <div class="info-group">
            <span class="question">Q: Cum ajung la pescuit?</span>
            <div class="answer-box">
                <span class="cmd">(/n)</span> Folosește comanda /gps -> Locații Joburi -> Fisherman.
            </div>
        </div>

    </div>

    <script src="nav-logic.js"></script>
</body>
</html>
