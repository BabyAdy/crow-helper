<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>CrowHelper - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#050505] text-white flex items-center justify-center min-h-screen">
    <div class="bg-[#0a0a0a] p-8 rounded-2xl border border-zinc-800 w-full max-w-sm shadow-2xl">
        <h1 class="text-2xl font-black text-center mb-6 uppercase tracking-tighter">Crow<span class="text-purple-600">Helper</span></h1>
        <div class="space-y-4">
            <input type="text" id="u" placeholder="Utilizator" class="w-full bg-[#111] border border-zinc-800 p-3 rounded-xl outline-none focus:border-purple-600">
            <input type="password" id="p" placeholder="Parolă" class="w-full bg-[#111] border border-zinc-800 p-3 rounded-xl outline-none focus:border-purple-600">
            <button onclick="login()" class="w-full bg-purple-600 py-3 rounded-xl font-bold hover:bg-purple-700 transition-all">CONECTARE STAFF</button>
            <button onclick="guest()" class="w-full text-zinc-500 text-sm italic">Continuă ca vizitator (Server Rules)</button>
        </div>
    </div>

    <script>
        const USERS = {
            'owner': { p: 'aadye', lv: 4 },
            'admin': { p: 'sugiblasen', lv: 3 },
            'helper': { p: 'milsugi', lv: 2 },
            'leader': { p: 'iao', lv: 1 }
        };

        function login() {
            const user = document.getElementById('u').value;
            const pass = document.getElementById('p').value;
            if (USERS[user] && USERS[user].p === pass) {
                localStorage.setItem('userLv', USERS[user].lv);
                localStorage.setItem('userName', user);
                window.location.href = 'pages/server-rules.html';
            } else { alert("Date incorecte!"); }
        }
        function guest() {
            localStorage.setItem('userLv', 0);
            window.location.href = 'pages/server-rules.html';
        }
    </script>
</body>
</html>
